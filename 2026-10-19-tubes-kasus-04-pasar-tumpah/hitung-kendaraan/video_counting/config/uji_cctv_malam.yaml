# Config uji CCTV malam Kamis 29 Okt 2026 (sekitar 18.45-18.52 WIB), 7 titik CCTV direkam bersamaan 6 menit.
# Salinan config utama, bedanya video diarahkan ke data/video/uji_malam/ dan titik T2 (tanpa CCTV) dibuang.
interval_menit: 1            # rekaman uji cuma 6 menit, interval dibuat 1 menit
model:
  bobot: yolo26s.pt          # dipilih dari uji 29 Okt: paling banyak menangkap kendaraan dan paling cepat
  imgsz: 640                 # sama dengan resolusi CCTV 640x480; titik beresolusi besar punya imgsz sendiri
  conf: 0.1                  # bawaan tracking Ultralytics, ByteTrack butuh deteksi conf rendah
  tracker: bytetrack.yaml    # diset eksplisit, default Ultralytics sekarang bukan ByteTrack
  kelas: [1, 2, 3, 5, 7]     # bicycle, car, motorcycle, bus, truck
  kedalaman_asal: 0.2        # sebelum melintas, kendaraan harus pernah >= 0,2 x tinggi kotaknya di sisi asal
  min_frame_track: 5         # track yang lebih pendek dari ini dianggap deteksi palsu

# Isi tiap titik:
#   cctv      nama dan url stream di pelindung.bandung.go.id; null = direkam pakai HP
#   video     file video titik ini, boleh pola (*) kalau rekamannya terpotong jadi beberapa bagian
#   mulai     jam mulai video HP; untuk CCTV biarkan null, jamnya diambil dari file .json hasil rekam_cctv.py
#   garis     satu kamera boleh punya beberapa garis hitung, satu garis = satu edge di graf
#             koordinat dan arah_dihitung diisi lewat kalibrasi.py
#             arah_dihitung = sisi garis tempat kendaraan DATANG untuk arah yang sesuai edge
#   ekr       SM dan KB WAJIB diisi dari tabel ekr PKJI 2014 sesuai tipe jalan, jangan pakai angka dari chat AI
#   antrean   catatan lapangan, daftar [mulai, selesai] saat ada antrean di hulu titik; null = belum dicatat
titik:
  - id: S1
    cctv: {nama: "CCTV ITB KEBUN BINATANG 01", url: "https://pelindung.bandung.go.id:3443/video/DAHUA/ITBKebun.m3u8"}
    imgsz: 1280                         # video kamera ini 1280x720
    video: data/video/uji_malam/S1/*.ts
    mulai: null
    tipe_jalan: null
    ekr: {KR: 1.0, SM: null, KB: null}
    antrean: null
    garis:
      - id: L1
        edge_model: S1->V_Cikapayang
        koordinat: [[600, 456], [980, 420]]
        arah_dihitung: positif

  - id: S2
    cctv: {nama: "CCTV DIPATIUKUR SEKELOA 02", url: "https://pelindung.bandung.go.id:3443/video/HIKSVISION/Dipaunp.m3u8"}
