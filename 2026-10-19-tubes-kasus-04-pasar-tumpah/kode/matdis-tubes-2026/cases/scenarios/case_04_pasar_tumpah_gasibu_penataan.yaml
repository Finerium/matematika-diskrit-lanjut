# Kasus 4 Pasar Tumpah Gasibu (Max Flow), kelompok kelas 2B.
# Dibuat otomatis dari model jaringan kelompok, rincian perhitungan kapasitas tiap ruas ada di
# 04_Komponen_Graf/Komponen_Graf_Gasibu.xlsx. Ubah modelnya, bukan file ini.
# Jaringan jalan: OpenStreetMap 19 Oktober 2026 (Jl. Diponegoro ruas Gedung Sate - Gasibu sudah ditutup
# permanen sejak 10 Juli 2026, jadi tidak dimodelkan).
# Kapasitas (capacity) dalam skr/jam menurut PKJI 2014: C = C0 x FCLJ x FCPA x FCHS x FCUK.
# Bobot (weight) = waktu tempuh bebas dalam menit, dipakai kalau skenario dijalankan dengan Dijkstra.
# road_class = fungsi jalan dari tag highway OSM (arteri, kolektor, lokal). heavy_vehicle = boleh dilewati
# bus dan truk (hanya arteri dan kolektor), dipakai scripts/analisis_kasus4.py, loader mengabaikannya.
# Skenario usulan: kondisi normal -> pasar dengan penataan.

